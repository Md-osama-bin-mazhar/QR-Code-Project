<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="qr.css">
    <link rel="icon" href="qr.png" type="image">
    <title>QR code Generator</title>

</head>
<body>
       
    <div class="wrapper">
        <div class="box">
            <img src="qr.png" class="qrcode">
            <input type="text" class="input" placeholder="Enter text or @URL">

            <button class="btn">Generate QR code</button>

        </div>
    </div>

    <script src="qr.js"></script>
</body>
</html>
